<section class="research-gallery" aria-labelledby="gallery-title">
  <div class="gallery-heading">
    <h2 id="gallery-title">{{ t.gallery.title }}</h2>
    <div class="gallery-controls">
      <button class="gallery-toggle" type="button" data-pause-label="{{ t.gallery.pause }}" data-play-label="{{ t.gallery.play }}" hidden>
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><g class="pause-symbol"><path d="M5 3v10M11 3v10" fill="none" stroke="currentColor" stroke-width="2"/></g><path class="play-symbol" d="m5 3 8 5-8 5Z" fill="currentColor"/></svg>
        <span>{{ t.gallery.pause }}</span>
      </button>
      <button class="gallery-arrow" type="button" data-direction="-1" aria-label="{{ t.gallery.previous }}" aria-controls="research-scenes" hidden><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m12 5-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="gallery-arrow" type="button" data-direction="1" aria-label="{{ t.gallery.next }}" aria-controls="research-scenes" hidden><svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="m8 5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </div>
  <div class="research-scenes" id="research-scenes">
    <a class="research-scene" href="{{ prefix | append: '/publications/#paper-empathy' | relative_url }}">
      <svg class="scene-art scene-empathy" viewBox="0 0 360 220" aria-hidden="true" focusable="false">
        <rect width="360" height="220" rx="10" fill="#edf5f1"/>
        <circle cx="304" cy="29" r="91" fill="#e3efea"/><circle cx="36" cy="205" r="72" fill="#e6eeef"/>
        <path d="M0 184c65-36 91 35 167 10s127-60 193-27" fill="none" stroke="#cfdfd8"/>
        <g fill="none" stroke="#d2e2db"><circle cx="289" cy="158" r="21"/><circle cx="289" cy="158" r="32"/></g>
        <rect x="63" y="35" width="234" height="153" rx="14" fill="#fff" stroke="#d8e5df"/>
        <circle cx="82" cy="51" r="3" fill="#b6d2c7"/><path d="M94 51h53" stroke="#cbd9d3" stroke-width="3" stroke-linecap="round"/>
        <path d="M75 64h210" stroke="#eef2f0"/>
        <g class="scene-motion dialogue-message dialogue-question">
          <path d="M111 77h136a9 9 0 0 1 9 9v24a9 9 0 0 1-9 9H127l-16 9V86a9 9 0 0 1 9-9Z" fill="#eeedf7"/>
          <path d="M126 93h93M126 104h64" stroke="#aaa5c8" stroke-width="3" stroke-linecap="round"/>
          <circle cx="275" cy="93" r="11" fill="#d8d3ec"/><circle cx="275" cy="90" r="3" fill="#8479a6"/><path d="M269 100a6 6 0 0 1 12 0" fill="#8479a6"/>
        </g>
        <g class="scene-motion dialogue-message dialogue-answer">
          <path d="M111 135h124a9 9 0 0 1 9 9v19a9 9 0 0 1-9 9H111l-13 8v-36a9 9 0 0 1 9-9Z" fill="#deeee6"/>
          <path d="M116 149h105M116 160h74" stroke="#74a493" stroke-width="3" stroke-linecap="round"/>
          <circle cx="82" cy="150" r="11" fill="#c6e0d4"/><path d="M76 150c2 0 2-4 4-4s2 8 4 8 2-4 4-4" fill="none" stroke="#4f8875" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <g class="scene-motion dialogue-typing" fill="#7da494"><circle cx="119" cy="151" r="3"/><circle cx="132" cy="151" r="3"/><circle cx="145" cy="151" r="3"/></g>
        <g class="scene-motion empathy-orbit" fill="#9cbbaf"><circle cx="36" cy="73" r="3"/><circle cx="324" cy="119" r="2.5"/><circle cx="308" cy="190" r="2"/></g>
      </svg>
      <span class="scene-title">{{ t.gallery.empathy }} <span aria-hidden="true">↗</span></span>
      <span class="scene-description">{{ t.gallery.empathy_text }}</span>
    </a>
    <a class="research-scene" href="{{ prefix | append: '/publications/#paper-support' | relative_url }}">

      </svg>
      <span class="scene-title">{{ t.gallery.support }} <span aria-hidden="true">↗</span></span>
      <span class="scene-description">{{ t.gallery.support_text }}</span>
    </a>
    <a class="research-scene" href="{{ prefix | append: '/publications/#paper-bayesian' | relative_url }}">

        <g fill="#e6eef5" stroke="#a9c4d6"><circle cx="93" cy="91" r="10"/><circle cx="147" cy="91" r="10"/><circle cx="122" cy="140" r="12"/><circle cx="157" cy="167" r="8"/></g>

        <path d="M18 192c5 0 5-10 10-10s5 18 10 18 5-8 10-8" fill="none" stroke="#acccd1" stroke-width="1.5"/>

      <span class="scene-title">{{ t.gallery.analytics }} <span aria-hidden="true">↗</span></span>
      <span class="scene-description">{{ t.gallery.analytics_text }}</span>
    </a>
    <a class="research-scene" href="{{ prefix | append: '/publications/#paper-misinformation' | relative_url }}">
      <svg class="scene-art scene-trust" viewBox="0 0 360 220" aria-hidden="true" focusable="false">
        <rect width="360" height="220" rx="10" fill="#f6f2eb"/>
        <circle cx="32" cy="25" r="93" fill="#eee9df"/><circle cx="328" cy="205" r="92" fill="#edece1"/>
