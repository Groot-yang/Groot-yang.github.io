  "intro": {
    "en": "I study how artificial intelligence can better understand people and support health decisions. My research connects explainable AI, large language models, and knowledge-driven methods with mental health support, digital therapeutics, and misinformation governance.",
    "zh": "我的研究聚焦人工智能如何理解人的需求并支持健康决策，将可解释人工智能、大语言模型与知识驱动方法应用于心理健康支持、数字疗法及错误信息治理。"
  },
  "bio": {
    "en": "I am a PhD candidate in Management Science and Engineering at the School of Management, Beijing Institute of Technology. My research specialization is Management Information Systems. I am advised by Prof. Zhijun Yan and Prof. Qiuju Yin.",
    "zh": "我目前是北京理工大学管理学院管理科学与工程专业博士研究生，研究方向为管理信息系统，导师为颜志军教授、尹秋菊教授。"
  },
